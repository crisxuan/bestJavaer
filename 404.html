<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Redirecting...</title>
</head>
<body>
  <script>
    (function () {
      var oldGithubPagesBase = '/bestJavaer/';
      var path = window.location.pathname;
      var route = path;

      if (route === '/bestJavaer') {
        route = oldGithubPagesBase;
      }

      if (route.indexOf(oldGithubPagesBase) === 0) {
        route = route.slice(oldGithubPagesBase.length);
      } else {
        route = route.replace(/^\//, '');
      }

      route = route.replace(/\/$/, '');
      var query = window.location.search || '';
      var hash = window.location.hash || '';

      if (route.slice(-3).toLowerCase() === '.md') {
        route = route.slice(0, -3);
      }

      window.location.replace('/#/' + route + query + hash);
    }());
  </script>
</body>
</html>
