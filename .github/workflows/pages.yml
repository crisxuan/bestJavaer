name: Redirect GitHub Pages to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://cxuan-labs.vercel.app/
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare redirect site
        run: |
          mkdir _site
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="robots" content="noindex">
            <link rel="canonical" href="https://cxuan-labs.vercel.app/">
            <meta http-equiv="refresh" content="0; url=https://cxuan-labs.vercel.app/">
            <title>Moved to Vercel</title>
          </head>
          <body>
            <script>
              (function () {
                var target = 'https://cxuan-labs.vercel.app/';
                var route = window.location.pathname.replace(/^\/bestJavaer\/?/, '').replace(/\/$/, '');
                var query = window.location.search || '';
                var hash = window.location.hash || '';

                if (hash) {
                  window.location.replace(target + hash);
                  return;
                }

                if (route.slice(-3).toLowerCase() === '.md') {
                  route = route.slice(0, -3);
                }

                window.location.replace(target + (route ? '#/' + route : '') + query);
              }());
            </script>
            <p>This site has moved to <a href="https://cxuan-labs.vercel.app/">cxuan-labs.vercel.app</a>.</p>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
